name: Publish

on:
  push:
    branches: [release]

permissions:
  id-token: write
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - id: changed
        name: Detect changed packages with version bumps
        run: |
          PACKAGES=()
          for pkg_dir in packages/*/; do
            PKG_NAME=$(jq -r .name "${pkg_dir}package.json")
            NEW_VERSION=$(jq -r .version "${pkg_dir}package.json")

            # Fetch the latest version published to npm
            PUBLISHED_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "")

            if [ -z "$PUBLISHED_VERSION" ]; then
              echo "→ $PKG_NAME: not yet published (will publish $NEW_VERSION)"
              PACKAGES+=("$PKG_NAME:$pkg_dir")
            elif [ "$PUBLISHED_VERSION" != "$NEW_VERSION" ]; then
              echo "→ $PKG_NAME: $PUBLISHED_VERSION → $NEW_VERSION"
              PACKAGES+=("$PKG_NAME:$pkg_dir")
            else
              echo "→ $PKG_NAME: $NEW_VERSION already published, skipping"
            fi
          done

          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "No packages to publish."
            echo "packages=[]" >> "$GITHUB_OUTPUT"
          else
            echo "packages=$(printf '%s\n' "${PACKAGES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Parse package info
        id: info
        run: |
          PKG_NAME="${PACKAGE_SPEC%%:*}"
          PKG_DIR="${PACKAGE_SPEC##*:}"
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
        env:
          PACKAGE_SPEC: ${{ matrix.package }}

      - run: bun install --frozen-lockfile

      - name: Build (acp only)
        if: steps.info.outputs.dir == 'packages/acp'
        run: bun run --cwd packages/acp build

      - name: Test (acp only)
        if: steps.info.outputs.dir == 'packages/acp'
        run: bun run --cwd packages/acp test

      - name: Publish
        run: |
          # Trusted publishing (OIDC): the npm registry accepts publishes from
          # this workflow via the trusted publisher configured on npmjs.com for
          # @touchtechclub/pi-oc-question. No NPM_TOKEN is needed; npm's CLI
          # auto-detects the GitHub Actions OIDC environment. Requires
          # permissions.id-token: write (set above) and a GitHub-hosted runner.
          bun add -g npm@latest
          cd "${{ steps.info.outputs.dir }}"
          bun pm pack
          TARBALL=$(ls *.tgz | head -1)
          # Publish from a neutral directory to stay outside the monorepo root.
          PUBLISH_DIR="$(mktemp -d)"
          mv "$TARBALL" "$PUBLISH_DIR/"
          cd "$PUBLISH_DIR"
          npm publish "$TARBALL" --access public --provenance

  release:
    needs: [detect-changes, publish]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse package info
        id: info
        run: |
          PKG_NAME="${PACKAGE_SPEC%%:*}"
          PKG_DIR="${PACKAGE_SPEC##*:}"
          VERSION=$(jq -r .version "${PKG_DIR}/package.json")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${PKG_NAME}@${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          PACKAGE_SPEC: ${{ matrix.package }}

      - name: Generate release notes
        id: notes
        run: |
          PKG_DIR="${{ steps.info.outputs.dir }}"
          TAG="${{ steps.info.outputs.tag }}"

          # Find the previous tag for this package to generate a changelog
          PREV_TAG=$(git tag --list "${PKG_NAME}@*" --sort=-version:refname | head -1 || echo "")

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
            CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          else
            RANGE="${GITHUB_SHA}"
            CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
          fi

          {
            echo "## Changes"
            echo ""
            # Only show commits that touched this package's directory
            git log --pretty=format:"- %s (%h)" "$RANGE" -- "$PKG_DIR" || echo "_Initial release_"
            echo ""
            echo ""
            echo "[Full Changelog](${CHANGELOG_URL})"
          } > release-notes.md

          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          body_path: release-notes.md
